name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13846066" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x ./gradlew
      - name: Build release and debug
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CloneApp-release-APK
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CloneApp-debug-APK
          path: app/build/outputs/apk/debug/*.apk
